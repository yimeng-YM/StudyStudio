use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - wikidata

general:
  debug: false
  instance_name: "StudyStudio Local Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "study-studio-local-only"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
