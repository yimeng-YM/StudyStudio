use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - wikidata

general:
  debug: false
  instance_name: "Local Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# The default engines currently rate-limit this home connection. Prefer the
# engines verified to return results from the SearXNG container.
engines:
  - name: bing
    disabled: false
  - name: baidu
    disabled: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: google cse
    disabled: true
  - name: startpage
    disabled: true
  - name: wikipedia
    disabled: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "local-search-only"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
