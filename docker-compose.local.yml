services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: studystudio-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:17891:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:17891/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-study-studio-local-only}"
    volumes:
      - ./backend/searxng:/etc/searxng:rw
